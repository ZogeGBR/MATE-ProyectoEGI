# k8s/deployments/app-deployment.yaml
# Alineado a Integrante 4 (rama Version1):
#   - namespace: inventario-egi
#   - label app: inventario-app (coincide con NetworkPolicies de Integrante 1)
#   - imagen: inventario-app:latest (cargada con minikube image load)
#   - ConfigMap: app-config (creado por Int. 4)
#   - Secret: app-secret (creado por Int. 4, en .gitignore)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: inventario-egi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-app
  template:
    metadata:
      labels:
        app: inventario-app    # ← label exacto que usan las NetworkPolicies de Int. 1
    spec:
      containers:
        - name: inventario-app
          image: inventario-app:latest
          imagePullPolicy: Never   # imagen cargada con: minikube image load inventario-app:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config   # ← ConfigMap de Int. 4 (MYSQL_HOST, MONGO_HOST, etc.)
            - secretRef:
                name: app-secret   # ← Secret de Int. 4 (MYSQL_PASSWORD, JWT_SECRET_KEY, etc.)
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
# k8s/services/app-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: inventario-app-service
  namespace: inventario-egi
spec:
  type: NodePort
  selector:
    app: inventario-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080    # accesible desde: minikube service inventario-app-service -n inventario-egi --url
